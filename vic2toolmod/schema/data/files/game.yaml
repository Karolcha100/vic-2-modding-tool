# Technologies, inventions, units, pop types, map and interface files.
file_types:
  technologies: {paths: ["technologies/*.txt"], rule: technologies, scope: country}
  inventions: {paths: ["inventions/*.txt"], rule: inventions, scope: country}
  units: {paths: ["units/*.txt"], rule: units}
  poptypes: {paths: ["poptypes/*.txt"], rule: poptype}
  regions: {paths: ["map/region.txt", "map/region_sea.txt"], rule: regions}
  continents: {paths: ["map/continent.txt"], rule: continents}
  map_other: {paths: ["map/*.txt", "map/*.map", "map/*/*.txt"], rule: any_file}
  interface: {paths: ["interface/*.gui", "interface/*.gfx", "interface/*.txt"], rule: any_file}

rules:
  technologies:
    patterns:
      - {key: any, rule: technology}
  technology:
    fields:
      area: {value: scalar, required: true}
      year: {value: int, required: true}
      cost: {value: int, required: true}
      unciv_military: bool
      ai_chance: {rule: weight}
      activate_unit: {value: ref:unit, multiple: true}
      activate_building: {value: ref:building, multiple: true}
      rgo_goods_output: {rule: goods_amounts, multiple: true}
      rgo_size: {rule: goods_amounts, multiple: true}
      rgo_goods_throughput: {rule: goods_amounts, multiple: true}
      factory_goods_output: {rule: goods_amounts, multiple: true}
      factory_goods_throughput: {rule: goods_amounts, multiple: true}
      factory_goods_input: {rule: goods_amounts, multiple: true, doc: 'Input goods of factories (K78: in v2game.exe).'}
      rgo_goods_input: {rule: goods_amounts, multiple: true, doc: 'Input goods of RGOs (K78: in v2game.exe).'}
      artisan_goods_input: {rule: goods_amounts, multiple: true, doc: 'Input goods of artisans (K78: in v2game.exe).'}
      artisan_goods_output: {rule: goods_amounts, multiple: true}
      artisan_goods_throughput: {rule: goods_amounts, multiple: true}
      army_base: {rule: unit_modifiers, doc: "Stats of all land units."}
      navy_base: {rule: unit_modifiers, doc: "Stats of all naval units."}
    patterns:
      - {key: ref:unit, rule: unit_modifiers}
    other: modifier
  goods_amounts:
    patterns:
      - {key: ref:goods, value: float}
  unit_modifiers:
    doc: "Changes of unit stats (attack, defence, speed, ...)."
    fields:
      fort: {rule: unit_modifiers, doc: "Stats when fighting at a fort (used by RPM; not verified in the game)."}
      attack: float
      defence: float
      discipline: float
      support: float
      maneuver: float
      maximum_speed: float
      reconnaissance: float
      default_organisation: float
      build_time: float
      supply_consumption: float
      siege: float
      hull: float
      gun_power: float
      fire_range: float
      evasion: float
      torpedo_attack: float
    other: warn

  inventions:
    patterns:
      - {key: any, rule: invention}
  invention:
    fields:
      limit: {block: trigger}
      chance: {rule: weight}
      effect: {rule: invention_effect}
      news: bool
      shared_prestige: float
    other: modifier
  invention_effect:
    fields:
      activate_unit: {value: ref:unit, multiple: true}
      activate_building: {value: ref:building, multiple: true}
      rgo_goods_output: {rule: goods_amounts, multiple: true}
      rgo_size: {rule: goods_amounts, multiple: true}
      rgo_goods_throughput: {rule: goods_amounts, multiple: true}
      factory_goods_output: {rule: goods_amounts, multiple: true}
      factory_goods_throughput: {rule: goods_amounts, multiple: true}
      factory_goods_input: {rule: goods_amounts, multiple: true, doc: 'Input goods of factories (K78: in v2game.exe).'}
      rgo_goods_input: {rule: goods_amounts, multiple: true, doc: 'Input goods of RGOs (K78: in v2game.exe).'}
      artisan_goods_input: {rule: goods_amounts, multiple: true, doc: 'Input goods of artisans (K78: in v2game.exe).'}
      artisan_goods_output: {rule: goods_amounts, multiple: true}
      artisan_goods_throughput: {rule: goods_amounts, multiple: true}
      rebel_org_gain: {rule: rebel_org_gain, multiple: true}
      gas_attack: bool
      gas_defence: bool
      enable_crime: scalar
      colonial_migration: float
      army_base: {rule: unit_modifiers}
      navy_base: {rule: unit_modifiers}
    patterns:
      - {key: ref:unit, rule: unit_modifiers}
    other: modifier
  rebel_org_gain:
    fields:
      faction: {value: scalar, required: true}
      value: {value: float, required: true}

  units:
    patterns:
      - {key: any, rule: unit}
  unit:
    doc: "A land or naval unit type: costs, stats, graphics."
    fields:
      build_cost: {rule: goods_amounts}
      supply_cost: {rule: goods_amounts}
      icon: {value: int, doc: "Icon of the unit type."}
      type: {value: scalar, doc: "land or naval."}
      sprite: {value: scalar, doc: "3D model of the unit."}
      unit_type: {value: scalar, doc: "infantry, cavalry, support, special, big_ship, light_ship or transport."}
      floating_flag: {value: bool, doc: "Show a flag above the unit."}
      priority: {value: int, doc: "Order in lists."}
      max_strength: {value: int, doc: "Full strength (men / hull)."}
      default_organisation: {value: float, doc: "Starting organisation."}
      maximum_speed: {value: float, doc: "Speed."}
      weighted_value: {value: float, doc: "Value for the AI and war score."}
      build_time: {value: int, doc: "Days to build."}
      active: {value: bool, doc: "Available from the start (else an invention enables it)."}
      reconnaissance: {value: float, doc: "Reconnaissance."}
      attack: {value: float, doc: "Attack."}
      defence: {value: float, doc: "Defence."}
      discipline: {value: float, doc: "Discipline."}
      support: {value: float, doc: "Support."}
      maneuver: {value: float, doc: "Maneuver."}
      naval_icon: {value: int, doc: "Icon in naval screens."}
      min_port_level: {value: int, doc: "Smallest naval base that can build it."}
      limit_per_port: {value: int, doc: "Ships per port (-1 = no limit)."}
      supply_consumption_score: {value: int, doc: "Supply needed (naval)."}
      hull: {value: float, doc: "Hull."}
      gun_power: {value: float, doc: "Gun power."}
      fire_range: {value: float, doc: "Fire range."}
      evasion: {value: float, doc: "Evasion."}
      can_build_overseas: {value: bool, doc: "Can be built in overseas provinces."}
      move_sound: {value: scalar, doc: "Sound when moving."}
      select_sound: {value: scalar, doc: "Sound when selected."}
      colonial_points: {value: int, doc: "Colonial points it gives."}
      primary_culture: {value: bool, doc: "Only pops of the primary culture can be recruited."}
      siege: {value: float, doc: "Siege."}
      capital: {value: bool, doc: "Built in the capital only."}
      sprite_mount: {value: scalar, doc: "Model of the mount."}
      sprite_mount_attach_node: {value: scalar, doc: "Node where the mount is attached."}
      sprite_override: {value: scalar, doc: "Model replacing the default."}
      transport: {value: bool, doc: "Transports land units."}
      torpedo_attack: {value: float, doc: "Torpedo attack."}
      sail: {value: bool, doc: "A sailing ship."}
      supply_consumption: {value: float, doc: "Supply consumption."}
    other: warn

  poptype:
    doc: "One pop type (the file name is the pop type)."
    fields:
      sprite: {value: int, required: true, sprite: GFX_pops_small, doc: "Icon of the pop type: a frame of gfx/interface/pops_small."}
      color: {list: int, min: 3, max: 3, required: true}
      strata: {value: enum:strata, required: true}
      life_needs: {rule: goods_amounts}
      everyday_needs: {rule: goods_amounts}
      luxury_needs: {rule: goods_amounts}
      rebel: {rule: rebel_units}
      promote_to: {rule: pop_weights}
      ideologies: {rule: ideology_weights}
      issues: {rule: issue_weights}
      country_migration_target: {rule: weight}
      migration_target: {rule: weight}
      equivalent: ref:pop_type
    other: any
  rebel_units:
    patterns:
      - {key: ref:unit, value: float}
  pop_weights:
    doc: "promote_to = { pop_type = { weight } } - where pops promote to (K59: promotion graph)."
    patterns:
      - {key: ref:pop_type, rule: weight}
  ideology_weights:
    patterns:
      - {key: ref:ideology, rule: weight}
  issue_weights:
    patterns:
      - {key: ref:issue_option, rule: weight}

  regions:
    doc: "REGION = { province ids }"
    patterns:
      - {key: any, list: int}
  continents:
    patterns:
      - {key: any, rule: continent}
  continent:
    fields:
      provinces: {list: int}
    other: modifier
