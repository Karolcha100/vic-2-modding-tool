  rank: 'The country''s rank is at most the value (rank = 8: one of the great powers).'
  rebel_power_fraction: Rebel strength compared with the army is at least the value.
  recruited_percentage: Share of soldiers recruited is at least the value.
  reduce_pop: Multiply the size of the pops by the value (0.9 = lose 10 %).
  region: True if the province is in the given state region.
  relation:
    effect: 'Change relations with a country: relation = { who = TAG value = 100 }.'
    trigger: 'Relations with a country are at least the value: relation = { who = TAG value = 100 }.'
  release: Release the given country (it gets its cores from this one).
  release_vassal: Release the given country as a vassal.
  religion:
    effect: Change the religion of the pops / state religion.
    trigger: True if the pop's / country's religion is the given one.
  religious_policy: True if the ruling party has the given religious policy.
  remove_accepted_culture: Remove an accepted culture.
  remove_core: Remove a core of the given country from this province.
  remove_country_modifier: Remove a country modifier.
  remove_province_modifier: Remove a province modifier.
  remove_random_economic_reforms: Undo a number of random economic reforms (unciv).
  remove_random_military_reforms: Undo a number of random military reforms (unciv).
  remove_random_political_reforms: Undo a number of random political reforms.
  remove_random_social_reforms: Undo a number of random social reforms.
  research_points: Add research points.
  revolt_percentage: Share of revolting pops is at least the value.
  rgo_size: Change the size of the province's RGO.
