  random_province: 'Scope: one random province. In a trigger: true if it holds for them (any_* = at least
    one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  random_state: 'Scope: one random state of this country. In a trigger: true if it holds for them (any_*
