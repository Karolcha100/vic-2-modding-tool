# Descriptions of triggers and effects without one of their own (T004, 2026-11-09).
# A string is for both contexts; {trigger: …, effect: …} when they differ.
# 'meaning not verified' = from the name / wiki, not checked in the game.
docs:
  accepted_culture: True if the given culture is accepted in the country.
  activate_technology: Give the country a technology.
  add_accepted_culture: Make a culture accepted in the country (union = this_union for the whole group).
  add_casus_belli: 'Give a casus belli against a country: add_casus_belli = { target = TAG type = … months
    = 12 }.'
  add_core: Add a core of the given country on this province (or the province to this country's cores).
  add_country_modifier: 'Give the country a modifier: add_country_modifier = { name = … duration = 365
    } (-1 = for ever).'
  add_crisis_interest: Make the country interested in the current crisis.
  add_crisis_temperature: Raise the temperature of the current crisis.
  add_province_modifier: 'Give the province a modifier: add_province_modifier = { name = … duration =
    365 }.'
  add_tax_relative_income: Add money relative to the tax income (1 = one month of income; meaning not
    verified).
  add_war_goal: 'Add a war goal in the current war: add_war_goal = { casus_belli = … }.'
  administration_spending: Administration spending is at least the value (share).
  agree_with_ruling_party: Share of pops that agree with the ruling party is at least the value.
  ai: True if the country is run by the AI (yes) or a player (no).
  all_core:
    effect: Effects for every core province of this country.
    trigger: True if every province that is a core of this country fulfils the conditions inside.
  alliance_with: True if allied with the given country.
  annex_to: This country is annexed by the given country (annex_to = TAG).
  any_core: 'Scope: core provinces of this country (in province scope: countries with a core on it). In
    a trigger: true if it holds for them (any_* = at least one); in an effect: the effects apply to them
    (any_* = each, random_* = one).'
  any_country: 'Scope: every existing country. In a trigger: true if it holds for them (any_* = at least
    one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_empty_neighbor_province: 'Scope: neighbouring provinces without an owner. In a trigger: true if
    it holds for them (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_*
    = one).'
  any_greater_power: 'Scope: the great powers. In a trigger: true if it holds for them (any_* = at least
    one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_neighbor_country: 'Scope: countries bordering this one. In a trigger: true if it holds for them
    (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_neighbor_province: 'Scope: provinces bordering this province. In a trigger: true if it holds for
    them (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_owned: 'Scope: provinces owned by this country. In a trigger: true if it holds for them (any_* =
    at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_owned_province: 'Scope: provinces owned by this country. In a trigger: true if it holds for them
    (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_pop: 'Scope: pops of this country / state / province. In a trigger: true if it holds for them (any_*
    = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_sphere_member: 'Scope: countries in this country''s sphere. In a trigger: true if it holds for them
    (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_state: 'Scope: states of this country. In a trigger: true if it holds for them (any_* = at least
    one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  any_substate: 'Scope: substates of this country. In a trigger: true if it holds for them (any_* = at
    least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  assimilate: Assimilate the pops to the owner's primary culture.
  average_consciousness: Average consciousness of the pops is at least the value.
  average_militancy: Average militancy of the pops is at least the value.
  badboy:
    effect: Add infamy (negative = remove).
    trigger: Infamy is at least the value (badboy = 0.5 = half of the infamy limit).
  blockade: Share of blockaded ports is at least the value.
  brigades_compare: Ratio of this country's brigades to the other's is at least the value (meaning not
    verified).
  build_factory_in_capital_state: Build the given factory in the capital's state.
  build_fort_in_capital: Build a fort level in the capital.
  build_railway_in_capital: Build a railroad level in the capital.
  can_build_factory: True if the country may build factories (by its policies).
  can_build_factory_in_capital_state: True if the given factory can be built in the capital's state.
  can_build_fort_in_capital: True if a fort can be built in the capital.
  can_build_in_province: True if the given building can be built in the province.
  can_build_railway_in_capital: True if a railroad can be built in the capital.
  can_create_vassals: True if the country can release vassals.
  can_nationalize: True if the country can nationalise foreign investments.
  capital:
    effect: Move the capital to the given province.
    trigger: True if the capital of this country is the given province (capital = 123).
  capital_scope: Scope change to the capital province of this country.
  cash_reserves: Pop's savings compared with its needs are at least the value (meaning not verified).
  casus_belli:
    effect: 'Give a casus belli: casus_belli = { target = TAG type = … months = 12 }.'
    trigger: True if this country has a casus belli against the given country.
  change_controller: Give control (occupation) of the province to the given country.
  change_province_name: Rename the province.
  change_region_name: Rename the state of the province.
  change_tag: The player's country becomes the given tag (cores move to it).
  change_tag_no_core_switch: Become the given tag without moving the cores.
  check_variable: 'A variable is at least the value: check_variable = { which = name value = 10 }.'
  citizenship_policy: True if the country has the given citizenship policy.
  civilization_progress: Westernisation progress is at least the value.
  civilized:
    effect: Make the country civilised (yes) or uncivilised (no).
    trigger: True if the country is civilised (yes / no).
  clr_country_flag: Remove a country flag.
  clr_global_flag: Remove a global flag.
  clr_province_flag: Remove a province flag.
  colonial_nation: True if the country has colonies.
  consciousness:
    effect: Add consciousness to the pops.
    trigger: Consciousness of the pop (or average) is at least the value.
  constructing_cb_progress: Progress of the CB being fabricated is at least the value.
  constructing_cb_type: True if the country is fabricating the given CB type.
  continent: True if the province is on the given continent.
  controlled_by: True if the province is controlled by the given country (or THIS, owner…).
  controlled_by_rebels: True if rebels control the province.
  controller:
    effect: Scope change to the controller of this province.
    trigger: Scope change to the controller (occupier) of this province.
  controls: True if the country controls the given province.
  country:
    effect: Scope change to the country of this pop / province.
    trigger: Scope change to the country of this pop / province.
  country_event: 'Fire a country event: country_event = id, or { id = … days = … } to delay it.'
  country_units_in_province: True if units of the given country are in the province.
  country_units_in_state: True if units of the given country are in the state.
  create_alliance: Make an alliance with the given country.
  create_vassal: Make the given country a vassal of this one.
  crime_fighting: Crime fighting (administration) spending is at least the value.
  crime_higher_than_education: True if crime fighting spending is higher than education.
  crisis_exist: True if a crisis is going on.
  crisis_state_scope: Scope change to the state the current crisis is about.
  cultural_union: Scope change to the cultural union country of this country's culture (e.g. GER for prussians).
  culture: True if the pop's culture is the given one.
  define_general: 'Create a general: define_general = { name = … personality = … background = … }.'
  diplomatic_influence:
    effect: 'Add influence with a country: diplomatic_influence = { who = TAG value = 50 }.'
    trigger: 'Influence with a country is at least the value: diplomatic_influence = { who = TAG value
      = 50 }.'
  dominant_issue: 'Change support of an issue among pops: dominant_issue = { value = … factor = … } (meaning
    not verified).'
  economic_policy: True if the ruling party has the given economic policy.
  economic_reform:
    effect: Set an economic reform (unciv).
    trigger: True if the given economic reform (unciv) is in place.
  education_spending: Education spending is at least the value.
  election:
    effect: Start an election.
    trigger: True if an election is running.
  empty: True if the province has no owner.
  enable_ideology: Enable an ideology (e.g. fascism) in the world.
  end_military_access: End military access in the given country.
  end_war: End the war with the given country.
  everyday_needs: Share of everyday needs the pop gets is at least the value.
  exists: True if the country exists (yes / no; or exists = TAG).
  flashpoint_tension:
    effect: Add flashpoint tension.
    trigger: Flashpoint tension of the state is at least the value.
  fort: Add fort levels in the province.
  from: 'Scope change to FROM: the scope that caused this one (in an event: who fired it).'
  government:
    effect: Change the government type.
    trigger: True if the country has the given government type.
  great_wars_enabled: True if great wars are enabled.
  has_building: True if the province / state has the given building.
  has_country_flag: True if the country has the flag (set with set_country_flag).
  has_country_modifier: True if the country has the modifier.
  has_crime: True if the province has the given crime (or any crime).
  has_cultural_sphere: True if the country has a cultural sphere (meaning not verified).
  has_culture_core: True if a country of this pop's culture has a core on the province.
  has_empty_adjacent_province: True if a neighbouring province has no owner.
  has_empty_adjacent_state: True if a neighbouring state has no owner.
  has_factories: True if the state has factories.
  has_global_flag: True if the global flag is set (set_global_flag).
  has_leader: True if the country has a leader with the given name.
  has_national_minority: True if the province has pops of non-accepted cultures.
  has_pop_culture: True if there are pops of the given culture.
  has_pop_religion: True if there are pops of the given religion.
  has_pop_type: True if there are pops of the given type.
  has_province_flag: True if the province has the flag (set_province_flag).
  has_province_modifier: True if the province has the modifier.
  has_recent_imigration: True if immigrants came in the last given months (the game's spelling).
  has_recently_lost_war: True if the country lost a war recently.
  has_unclaimed_cores: True if the country has cores it does not own.
  have_core_in: True if the country has a core in a province of the given country.
  ideology:
    effect: Change the pop's ideology support (meaning in effects not verified).
    trigger: True if the pop's (or party's) ideology is the given one.
  in_default: True if the country (or the given one) is bankrupt.
  in_sphere: True if the country is in the sphere of the given country.
  independence:
    effect: Make the country independent (meaning not verified).
    trigger: True if the country is not a vassal (meaning not verified).
  industrial_score: Industrial score is at least the value (or the given country's).
  infrastructure: Add railroad levels in the province.
  inherit: Annex the given country peacefully (its provinces go to this one).
  invention: True if the country has the invention.
  involved_in_crisis: True if the country takes part in the current crisis.
  is_accepted_culture: True if the pop's culture is accepted (yes / no).
  is_blockaded: True if the province is blockaded.
  is_canal_enabled: True if the given canal is open (1 Kiel, 2 Suez, 3 Panama).
  is_capital: True if the province is the capital.
  is_claim_crisis: True if the current crisis is a claim crisis.
  is_coastal: True if the province is on the coast.
  is_colonial: True if the province / state is a colony.
  is_colonial_crisis: True if the current crisis is a colonial crisis.
  is_core: True if the province is a core of the given country.
  is_cultural_union: True if the country is the cultural union of its culture group (or of the given country).
  is_culture_group: 'True if the culture belongs to the given group (in country scope: a country''s primary
    culture group).'
  is_disarmed: True if the country is disarmed after a war.
  is_greater_power: True if the country is a great power.
  is_ideology_enabled: True if the ideology is enabled.
  is_independant: True if the country is independent (the game's spelling).
  is_liberation_crisis: True if the current crisis is a liberation crisis.
  is_mobilised: True if the country is mobilised.
  is_our_vassal: True if the given country is our vassal.
  is_overseas: True if the province is overseas (another continent than the capital).
  is_possible_vassal: True if the given country can be released as a vassal.
  is_primary_culture: True if the culture is the country's primary culture.
  is_releasable_vassal: True if the country can be released from another one.
  is_secondary_power: True if the country is a secondary power.
  is_slave: Make the state's pops slaves (yes) or free them (no; meaning not verified).
  is_sphere_leader_of: True if this country leads the given country's sphere.
  is_state_capital: True if the province is the capital of its state.
  is_state_religion: True if the pop's religion is the state religion.
  is_substate: True if the country is a substate.
  is_vassal: True if the country is a vassal (of anyone).
  kill_leader: Kill a leader by name.
  leave_alliance: End the alliance with the given country.
  life_needs: Share of life needs the pop gets is at least the value.
  life_rating:
    effect: Change the life rating of the province.
    trigger: Life rating of the province is at least the value.
  literacy:
    effect: Change literacy of the pops.
    trigger: Literacy (share 0..1) is at least the value.
  location: Scope change to the province of this pop.
  lost_national: Share of national provinces lost is at least the value.
  luxury_needs: Share of luxury needs the pop gets is at least the value.
  middle_strata_everyday_needs: Everyday needs of the middle strata are at least the value.
  middle_strata_life_needs: Life needs of the middle strata are at least the value.
  middle_strata_luxury_needs: Luxury needs of the middle strata are at least the value.
  middle_strata_militancy: Militancy of the middle strata is at least the value.
  middle_tax: Middle class tax is at least the value.
  militancy:
    effect: Add militancy to the pops.
    trigger: Militancy of the pop (or average) is at least the value.
  military_access:
    effect: Get military access in the given country.
    trigger: True if this country has military access in the given country.
  military_reform:
    effect: Set a military reform (unciv).
    trigger: True if the given military reform (unciv) is in place.
  military_score: Military score is at least the value (or the given country's).
  military_spending: Military spending is at least the value.
  minorities: True if the country has minorities (pops of non-accepted cultures).
  money:
    effect: Add money (negative = take).
    trigger: Treasury is at least the value.
  month: The month is at least the value (whether January is 0 or 1 is not verified).
  move_issue_percentage: 'Move support between issues: move_issue_percentage = { from = … to = … value
    = 0.1 }.'
  move_pop: Move the pop to the given province.
  national_provinces_occupied: Share of occupied national provinces is at least the value.
  nationalize: Nationalise foreign investments in this country.
  nationalvalue:
    effect: Change the national value.
    trigger: True if the country has the given national value.
  naval_base: Add naval base levels in the province.
  neighbour: True if the country borders the given country.
  neutrality: Leave all alliances and become neutral.
  num_of_allies: Number of allies is at least the value.
  num_of_cities: Number of provinces is at least the value.
  num_of_ports: Number of ports is at least the value.
  num_of_revolts: Number of revolts is at least the value.
  num_of_substates: Number of substates is at least the value.
  num_of_vassals: Number of vassals is at least the value.
  num_of_vassals_no_substates: Number of vassals (without substates) is at least the value.
  number_of_states: Number of states is at least the value.
  overlord: Scope change to the overlord of this vassal / substate.
  owned_by: True if the province is owned by the given country.
  owner:
    effect: Scope change to the owner of this province.
    trigger: Scope change to the owner of this province (owner = { … }).
  owns: True if the country owns the given province.
  part_of_sphere: True if the country is in someone's sphere.
  plurality: Add plurality (points).
  political_movement: True if there is a political movement.
  political_movement_strength: Strength of political movements is at least the value.
  political_reform:
    effect: Set a political reform.
    trigger: True if the given political reform is in place (or the desire for reforms is at least the
      value).
  political_reform_want: Desire for political reforms is at least the value.
  poor_strata_everyday_needs: Everyday needs of the poor strata are at least the value.
  poor_strata_life_needs: Life needs of the poor strata are at least the value.
  poor_strata_luxury_needs: Luxury needs of the poor strata are at least the value.
  poor_strata_militancy: Militancy of the poor strata is at least the value.
  poor_tax: Poor tax is at least the value.
  pop_majority_culture: True if most pops have the given culture.
  pop_majority_ideology: True if most pops support the given ideology.
  pop_majority_issue: True if most pops support the given issue.
  pop_majority_religion: True if most pops have the given religion.
  pop_militancy: Militancy of the pop is at least the value.
  pop_type:
    effect: Change the type of the pops (e.g. to soldiers).
    trigger: True if the pop is of the given type.
  port: True if the province has a port.
  prestige:
    effect: Add prestige.
    trigger: Prestige is at least the value.
  prestige_factor: Add prestige as a share of the current prestige (meaning not verified).
  primary_culture:
    effect: Change the primary culture of the country.
    trigger: True if the country's primary culture is the given one.
  produces: True if the country / province produces the given goods.
  province_control_days: Days the province has been controlled is at least the value.
  province_event: 'Fire a province event: province_event = id, or { id = … days = … } to delay it.'
  province_id: True if the province has the given id.
  random_country: 'Scope: one random country (limit = { } narrows the choice). In a trigger: true if it
    holds for them (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_*
    = one).'
  random_empty_neighbor_province: Effects for one random neighbouring province without an owner.
  random_neighbor_country: 'Scope: one random neighbouring country. In a trigger: true if it holds for
    them (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  random_neighbor_province: 'Scope: one random neighbouring province. In a trigger: true if it holds for
    them (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  random_owned: 'Scope: one random province owned by this country. In a trigger: true if it holds for
    them (any_* = at least one); in an effect: the effects apply to them (any_* = each, random_* = one).'
  random_pop: 'Scope: one random pop. In a trigger: true if it holds for them (any_* = at least one);
