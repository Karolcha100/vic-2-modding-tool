    trigger: True if the ruling party has the given ideology.
  sea_zone: Scope change to the sea zone next to this coastal province.
  secede_province: The province goes to the given country.
  set_country_flag: Set a country flag (test it with has_country_flag).
  set_global_flag: Set a global flag (test it with has_global_flag).
  set_province_flag: Set a province flag (test it with has_province_flag).
  slavery: True if slavery is allowed (meaning not verified).
  social_movement: True if there is a social movement.
