  state_scope: Scope change to the state of this province or pop.
  strata: True if the pop is of the given strata (poor / middle / rich).
  stronger_army_than: True if this country's army is stronger than the given country's.
  substate_of: True if the country is a substate of the given country.
  tag: True if the country is the given tag.
  terrain: True if the province has the given terrain.
  this: 'Scope change to THIS: the scope the event or effect started in.'
  this_culture_union: True if the country is the cultural union of the given culture (meaning not verified).
