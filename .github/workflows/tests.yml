# Tests on Linux and Windows on every push (K74 = B). Tests that need the
# game's files are skipped here (no game folder configured).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check vic2toolmod tests tools
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
